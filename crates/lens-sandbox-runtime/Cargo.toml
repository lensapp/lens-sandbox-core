[package]
name = "lens-sandbox-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Non-root runtime inside a Lens sandbox workload"
repository = "https://github.com/lensapp/lens-sandbox-core"

[target.'cfg(target_os = "linux")'.dependencies]
lens-sandbox-core = { path = "../lens-sandbox-core", default-features = false, features = ["channel"] }
bytes = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tempfile = "3"
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport"] }
landlock = "0.4"
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "process", "thread"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "time", "macros", "net", "io-util", "process"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
base64 = "0.22"
lens-sandbox-supervisor = { path = "../lens-sandbox-supervisor" }
rcgen = { version = "0.13", features = ["crypto"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "warn"
