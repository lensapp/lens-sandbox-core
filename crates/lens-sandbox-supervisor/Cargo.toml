[package]
name = "lens-sandbox-supervisor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "Supervisor side of the channel to a Lens sandbox runtime"
repository = "https://github.com/lensapp/lens-sandbox-core"

[dependencies]
lens-sandbox-core = { path = "../lens-sandbox-core", features = ["channel"] }
bytes = "1"
rcgen = { version = "0.13", features = ["crypto"] }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net", "io-util"] }
tokio-stream = "0.1"
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tracing = "0.1"
x509-parser = "0.18"

[dev-dependencies]
hickory-proto = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = "1"
