[package]
name = "lens-sandbox-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Core library for Lens sandbox runtime — proxy, MITM, nftables lockdown, policy handling"
repository = "https://github.com/lensapp/lens-sandbox-core"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
nix = { version = "0.30", features = ["signal", "process", "user", "fs", "term", "ioctl", "net", "socket"] }
base64 = "0.22"
libc = "0.2"
rand = "0.9"
ipnet = "2"
schemars = "1"
async-trait = "0.1"
rcgen = { version = "0.13", features = ["crypto"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
webpki-roots = "1"
aws-sigv4 = { version = "1", default-features = false, features = ["http1", "sign-http"] }
aws-credential-types = "1"
sha2 = "0.10"
hex = "0.4"
hickory-proto = "0.26"

# AF_VSOCK is Linux-only
[target.'cfg(target_os = "linux")'.dependencies]
tokio-vsock = "0.7"

[[bin]]
name = "generate-policy-schema"
path = "src/bin/generate_policy_schema.rs"

[dev-dependencies]
tempfile = "3"
