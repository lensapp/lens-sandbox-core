name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep in step with rust-toolchain.toml: the action sets RUSTUP_TOOLCHAIN,
  # which overrides that file, so CI has to name the same compiler itself.
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo test --workspace

  cage:
    name: Cage tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: sudo apt-get update && sudo apt-get install -y nftables
      # Build as the runner user, so root owns nothing in `target/` for the
      # cache step that follows the tests to trip over.
      - run: cargo test -p lens-sandbox-core --tests --no-run
      # `CAP_NET_ADMIN` for the nftables rules, and one thread because the cage
      # tests share one table and one queue reader (see
      # `udp_egress_over_nfqueue.rs`). These probe an address off the box, so
      # they need the runner's own routes.
      - run: >
          sudo -E env "PATH=$PATH" cargo test -p lens-sandbox-core --tests --
          --ignored --test-threads=1
          --skip the_supervisors_own_lookup_never_reaches_the_stub
      # That one test needs a namespace of its own, and `lo` as the only way
      # out — see its module doc for what a shared namespace hides.
      - run: >
          sudo -E env "PATH=$PATH" unshare -n -- sh -c
          'ip link set lo up && ip route add default dev lo &&
          cargo test -p lens-sandbox-core --test supervisor_lookup_over_the_cage -- --ignored'
      # A killed test binary never runs its drop guard, and a stranded table
      # confines the runner itself.
      - if: always()
        run: sudo nft delete table inet lens_sandbox || true

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  schema:
    name: Schema up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - run: |
          cargo run --bin generate-policy-schema > /tmp/schema-generated.json
          if ! diff schemas/policy.schema.json /tmp/schema-generated.json; then
            echo "schemas/policy.schema.json is stale — run: cargo run --bin generate-policy-schema > schemas/policy.schema.json"
            exit 1
          fi
